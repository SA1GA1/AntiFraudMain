[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antifraud-backend"
version = "0.1.0"
description = "Behavioral antifraud scoring backend (rules + PyTorch + local LLM)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "torch>=2.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "httpx>=0.27",
    "structlog>=24.4",
    "mlflow>=2.10",
    "pandera>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "merchant_mock*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
